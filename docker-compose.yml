version: '3.9'

networks:
  autumn_net:
    driver: bridge

services:
  db:
    image: postgres:16
    container_name: autism_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autism_school}
      POSTGRES_USER: ${DB_USER:-autism_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autism_pass_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autumn_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autism_user} -d ${DB_NAME:-autism_school}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_backup:
    image: postgres:16
    container_name: autism_db_backup
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autism_school}
      POSTGRES_USER: ${DB_USER:-autism_user}
      PGPASSWORD: ${DB_PASSWORD:-autism_pass_2024}
      PGHOST: db
    volumes:
      - db_backups:/backups
      - ./scripts/db_backup.sh:/db_backup.sh:ro
    networks:
      - autumn_net
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
        while true; do
          bash /db_backup.sh;
          sleep 86400;
        done
      "

  redis:
    image: redis:7-alpine
    container_name: autism_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - autumn_net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autism_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    networks:
      - autumn_net
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autism_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - autumn_net
    expose:
      - "3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: autism_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    networks:
      - autumn_net
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  db_backups:
    driver: local
