name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd ~/autumn
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh

  deploy-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync to server
        env:
          DEST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/autumn/frontend/.next/standalone
        run: |
          R="rsync -az -e 'ssh -i ~/.ssh/deploy_key'"

          # node_modules — no delete, too large to risk partial wipe
          eval "$R frontend/.next/standalone/node_modules/ $DEST/node_modules/"

          # entry point
          eval "$R frontend/.next/standalone/server.js frontend/.next/standalone/package.json $DEST/"

          # manifests
          eval "$R \
            frontend/.next/standalone/.next/BUILD_ID \
            frontend/.next/standalone/.next/app-build-manifest.json \
            frontend/.next/standalone/.next/app-path-routes-manifest.json \
            frontend/.next/standalone/.next/build-manifest.json \
            frontend/.next/standalone/.next/package.json \
            frontend/.next/standalone/.next/prerender-manifest.js \
            frontend/.next/standalone/.next/prerender-manifest.json \
            frontend/.next/standalone/.next/react-loadable-manifest.json \
            frontend/.next/standalone/.next/required-server-files.json \
            frontend/.next/standalone/.next/routes-manifest.json \
            $DEST/.next/"

          # server-side page bundles
          eval "$R --delete frontend/.next/standalone/.next/server/ $DEST/.next/server/"

          # static assets and public
          eval "$R --delete frontend/.next/static/ $DEST/.next/static/"
          eval "$R --delete frontend/public/ $DEST/public/"

      - name: Restart frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: systemctl restart autumn-frontend
