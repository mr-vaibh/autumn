name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd ~/autumn
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh

  deploy-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync to server
        env:
          SERVER: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          RSYNC: rsync -az -e "ssh -i ~/.ssh/deploy_key"
          REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/autumn/frontend/.next/standalone
        run: |
          # node_modules — no delete, too large to risk partial wipe
          $RSYNC frontend/.next/standalone/node_modules/ $REMOTE/node_modules/

          # entry point
          $RSYNC frontend/.next/standalone/server.js frontend/.next/standalone/package.json $REMOTE/

          # manifests
          $RSYNC \
            frontend/.next/standalone/.next/BUILD_ID \
            frontend/.next/standalone/.next/app-build-manifest.json \
            frontend/.next/standalone/.next/app-path-routes-manifest.json \
            frontend/.next/standalone/.next/build-manifest.json \
            frontend/.next/standalone/.next/package.json \
            frontend/.next/standalone/.next/prerender-manifest.js \
            frontend/.next/standalone/.next/prerender-manifest.json \
            frontend/.next/standalone/.next/react-loadable-manifest.json \
            frontend/.next/standalone/.next/required-server-files.json \
            frontend/.next/standalone/.next/routes-manifest.json \
            $REMOTE/.next/

          # server-side page bundles
          $RSYNC --delete frontend/.next/standalone/.next/server/ $REMOTE/.next/server/

          # static assets and public
          $RSYNC --delete frontend/.next/static/ $REMOTE/.next/static/
          $RSYNC --delete frontend/public/ $REMOTE/public/

      - name: Restart frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: systemctl restart autumn-frontend
